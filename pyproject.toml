[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BattCompiler"
version = "1.0.1"
authors = [
  { name="XTerGamingYT", email="notspecified@gmail.com" },
]
description = "Automatically convert a Windows Batch file to an EXE using PyInstaller."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyinstaller>=6.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[project.scripts]
battc = "battcompiler.main:start"
