[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BattCompiler"
version = "2.2.5"
authors = [
  { name="XTerGamingYT" },
]
description = "Automatically convert a Windows Batch file to an EXE using PyInstaller."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyinstaller>=6.0.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]

[tool.setuptools.packages.find]
where = ["src"] 

[project.scripts]
battc = "battcompiler.main:start"
